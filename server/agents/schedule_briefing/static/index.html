<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일정 브리핑 음성 테스트</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #070a0f; color: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -20%, rgba(96,86,255,.25), transparent 38rem), radial-gradient(circle at 100% 75%, rgba(25,155,255,.1), transparent 30rem), #070a0f; }
    button { font: inherit; }
    .shell { width: min(940px, calc(100% - 30px)); margin: 0 auto; padding: 30px 0 60px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(145deg,#7366ff,#318fff); box-shadow: 0 10px 30px rgba(72,83,255,.3); }
    .logo svg { width: 22px; }
    .overline { color: #7f899a; font-size: 10px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 3px 0 0; font-size: 18px; letter-spacing: -.02em; }
    .local { border: 1px solid #263043; border-radius: 999px; padding: 7px 11px; color: #8994a7; font-size: 11px; }
    .panel { border: 1px solid #202938; border-radius: 24px; background: rgba(14,19,28,.88); box-shadow: 0 28px 90px rgba(0,0,0,.3); overflow: hidden; }
    .voice-zone { min-height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 22px 34px; text-align: center; border-bottom: 1px solid #202938; }
    .status { color: #8994a8; font-size: 12px; font-weight: 750; letter-spacing: .06em; margin-bottom: 22px; min-height: 18px; }
    .mic-wrap { position: relative; width: 116px; height: 116px; display: grid; place-items: center; margin-bottom: 24px; }
    .ring { position: absolute; inset: 0; border: 1px solid rgba(112,107,255,.28); border-radius: 50%; opacity: 0; }
    .listening .ring { animation: pulse 1.8s ease-out infinite; opacity: 1; }
    .listening .ring:nth-child(2) { animation-delay: .6s; }
    @keyframes pulse { from { transform: scale(.72); opacity: .8; } to { transform: scale(1.35); opacity: 0; } }
    .mic { position: relative; z-index: 2; width: 86px; height: 86px; border-radius: 50%; border: 0; color: white; cursor: pointer; background: linear-gradient(145deg,#6f61ff,#348fff); box-shadow: 0 14px 42px rgba(66,78,255,.38); transition: transform .2s, filter .2s; }
    .mic:hover { transform: scale(1.04); filter: brightness(1.08); }
    .mic:disabled { cursor: wait; opacity: .65; transform: none; }
    .mic svg { width: 30px; height: 30px; }
    .listening .mic { background: linear-gradient(145deg,#ff5d70,#ff824e); box-shadow: 0 14px 42px rgba(255,77,91,.35); }
    .prompt { margin: 0; font-size: 20px; font-weight: 720; letter-spacing: -.025em; }
    .hint { color: #727d91; font-size: 12px; margin-top: 9px; }
    .conversation { padding: 26px; display: grid; gap: 18px; }
    .message { display: grid; grid-template-columns: 36px 1fr; gap: 12px; }
    .avatar { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 11px; font-weight: 850; background: #182131; color: #8390a7; }
    .message.assistant .avatar { background: linear-gradient(145deg,rgba(111,97,255,.3),rgba(52,143,255,.22)); color: #bbb7ff; }
    .bubble { border: 1px solid #202a3a; background: #0b1018; border-radius: 6px 16px 16px 16px; padding: 15px 17px; min-height: 54px; }
    .message.assistant .bubble { background: linear-gradient(135deg,rgba(105,91,255,.09),rgba(37,117,211,.05)); border-color: #283252; }
    .label { color: #707b8e; font-size: 10px; font-weight: 800; letter-spacing: .1em; margin-bottom: 7px; }
    .text { color: #dfe4ed; font-size: 14px; line-height: 1.62; white-space: pre-line; }
    .placeholder { color: #5e687a; }
    .audio { display: none; width: 100%; height: 38px; margin-top: 13px; }
    .audio.show { display: block; }
    .details { display: none; margin-top: 4px; border-top: 1px solid #202938; padding-top: 18px; }
    .details.show { display: block; }
    .details-head { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 12px; font-weight: 750; }
    .count { color: #788399; font-weight: 500; }
    .event-list { display: grid; gap: 8px; }
    .event { display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 12px 14px; border: 1px solid #202938; border-radius: 12px; background: #0a0f16; }
    .event.overlap { border-color: rgba(255,177,65,.45); }
    .time { color: #969fb0; font-size: 11px; font-weight: 800; }
    .event-title { color: #d6dce7; font-size: 12px; font-weight: 750; }
    .event-meta { color: #687386; font-size: 10px; margin-top: 5px; }
    .error { display: none; color: #ff929b; background: rgba(255,83,99,.08); border: 1px solid rgba(255,98,111,.24); border-radius: 12px; padding: 13px 15px; font-size: 12px; line-height: 1.55; }
    .error.show { display: block; }
    .flow { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 22px; color: #596477; font-size: 10px; font-weight: 800; letter-spacing: .06em; }
    .flow span { padding: 6px 9px; border-radius: 999px; border: 1px solid #202938; }
    .flow span.active { color: #b9b5ff; border-color: #504ca2; background: rgba(105,91,255,.12); }
    @media (max-width: 600px) { .voice-zone { min-height: 330px; } .conversation { padding: 20px 15px; } .event { grid-template-columns: 66px 1fr; } .flow { gap: 4px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg></div><div><div class="overline">VOICE AGENT TEST</div><h1>일정 브리핑</h1></div></div>
      <div class="local">LOCAL · 독립 실행</div>
    </header>

    <section class="panel">
      <div id="voice-zone" class="voice-zone">
        <div id="status" class="status">마이크를 눌러 음성 명령을 시작하세요</div>
        <div class="mic-wrap"><span class="ring"></span><span class="ring"></span><button id="mic" class="mic" aria-label="음성 녹음 시작"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg></button></div>
        <p id="prompt" class="prompt">“자비스, 오늘 일정 브리핑 해줘”</p>
        <div id="hint" class="hint">한 번 눌러 말하고, 다시 누르면 음성 인식이 시작됩니다.</div>
        <div class="flow"><span id="step-stt">STT</span><b>→</b><span id="step-calendar">CALENDAR</span><b>→</b><span id="step-tts">TTS</span></div>
      </div>

      <div class="conversation">
        <div class="message user"><div class="avatar">ME</div><div class="bubble"><div class="label">내 음성 · STT</div><div id="transcript" class="text placeholder">인식된 명령이 여기에 표시됩니다.</div></div></div>
        <div class="message assistant"><div class="avatar">J</div><div class="bubble"><div class="label">일정 브리핑 · 텍스트 & 음성</div><div id="briefing" class="text placeholder">브리핑 결과가 텍스트로 표시되고 같은 내용이 음성으로 재생됩니다.</div><audio id="audio" class="audio" controls></audio></div></div>
        <div id="error" class="error"></div>
        <div id="details" class="details"><div class="details-head"><span>Apple Calendar 일정</span><span id="count" class="count"></span></div><div id="events" class="event-list"></div></div>
      </div>
    </section>
  </main>

  <script>
    const micButton = document.querySelector('#mic');
    const voiceZone = document.querySelector('#voice-zone');
    const statusText = document.querySelector('#status');
    const hint = document.querySelector('#hint');
    const transcript = document.querySelector('#transcript');
    const briefing = document.querySelector('#briefing');
    const errorBox = document.querySelector('#error');
    const audioPlayer = document.querySelector('#audio');
    const details = document.querySelector('#details');
    const eventsRoot = document.querySelector('#events');
    const count = document.querySelector('#count');
    const steps = { stt: document.querySelector('#step-stt'), calendar: document.querySelector('#step-calendar'), tts: document.querySelector('#step-tts') };
    let recording = false;
    let socket = null;
    let stream = null;
    let context = null;
    let processor = null;
    let source = null;
    let objectUrl = null;

    function setStep(name) { Object.entries(steps).forEach(([key, element]) => element.classList.toggle('active', key === name)); }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    function downsample(input, inputRate) { const ratio = inputRate / 16000; const result = new Float32Array(Math.floor(input.length / ratio)); for (let i=0; i<result.length; i++) result[i] = input[Math.floor(i*ratio)]; return result; }
    function pcm16(input) { const buffer = new ArrayBuffer(input.length*2); const view = new DataView(buffer); input.forEach((value,index) => { const sample=Math.max(-1,Math.min(1,value)); view.setInt16(index*2,sample<0?sample*0x8000:sample*0x7fff,true); }); return buffer; }
    function cleanAudio() { processor?.disconnect(); source?.disconnect(); stream?.getTracks().forEach(track => track.stop()); context?.close(); processor=null; source=null; stream=null; context=null; }
    function showError(message, hintText='') { errorBox.textContent = [message, hintText].filter(Boolean).join(' '); errorBox.classList.add('show'); statusText.textContent='처리하지 못했습니다'; setStep(''); micButton.disabled=false; }
    function timeText(event) { if (event.allDay) return '종일'; const opts={hour:'2-digit',minute:'2-digit',hour12:false}; return `${new Date(event.start).toLocaleTimeString('ko-KR',opts)}–${new Date(event.end).toLocaleTimeString('ko-KR',opts)}`; }
    function renderEvents(events) { details.classList.add('show'); count.textContent=`${events.length}개`; eventsRoot.innerHTML=events.length?events.map(event=>`<div class="event ${event.overlap?'overlap':''}"><div class="time">${escapeHtml(timeText(event))}</div><div><div class="event-title">${escapeHtml(event.title)}</div><div class="event-meta">${escapeHtml(event.calendar||'캘린더')}${event.location?` · ${escapeHtml(event.location)}`:''}${event.overlap?' · 시간 겹침':''}</div></div></div>`).join(''):'<div class="event"><div class="event-title">등록된 일정이 없습니다.</div></div>'; }

    function handleJson(message) {
      if (message.type==='status') { statusText.textContent=message.message; setStep(message.phase==='transcribing'?'stt':message.phase==='calendar'?'calendar':message.phase==='speaking'?'tts':''); return; }
      if (message.type==='transcript') { transcript.textContent=message.text||'음성을 인식하지 못했습니다.'; transcript.classList.remove('placeholder'); return; }
      if (message.type==='briefing') { briefing.textContent=message.briefing; briefing.classList.remove('placeholder'); renderEvents(message.events); return; }
      if (message.type==='audio') { statusText.textContent='브리핑 음성을 재생합니다'; setStep('tts'); return; }
      if (message.type==='done') { statusText.textContent='일정 브리핑 완료'; setStep(''); micButton.disabled=false; return; }
      if (message.type==='error') showError(message.message,message.hint);
    }

    async function startRecording() {
      errorBox.classList.remove('show'); details.classList.remove('show'); audioPlayer.classList.remove('show');
      transcript.textContent='듣고 있습니다…'; transcript.classList.add('placeholder');
      briefing.textContent='음성 명령을 처리한 뒤 일정 브리핑을 생성합니다.'; briefing.classList.add('placeholder');
      try {
        stream=await navigator.mediaDevices.getUserMedia({audio:true});
        context=new AudioContext(); source=context.createMediaStreamSource(stream); processor=context.createScriptProcessor(4096,1,1);
        const scheme=location.protocol==='https:'?'wss':'ws'; socket=new WebSocket(`${scheme}://${location.host}/ws/voice-briefing`); socket.binaryType='arraybuffer';
        socket.onopen=()=>{ socket.send(JSON.stringify({type:'start'})); processor.onaudioprocess=event=>{ if(socket?.readyState===WebSocket.OPEN) socket.send(pcm16(downsample(event.inputBuffer.getChannelData(0),context.sampleRate))); }; source.connect(processor); processor.connect(context.destination); };
        socket.onmessage=event=>{ if(typeof event.data==='string'){ try{handleJson(JSON.parse(event.data));}catch{} return; } if(objectUrl) URL.revokeObjectURL(objectUrl); objectUrl=URL.createObjectURL(new Blob([event.data],{type:'audio/wav'})); audioPlayer.src=objectUrl; audioPlayer.classList.add('show'); audioPlayer.play().catch(()=>{}); };
        socket.onerror=()=>showError('음성 서버 연결에 실패했습니다.');
        recording=true; voiceZone.classList.add('listening'); statusText.textContent='듣고 있습니다'; hint.textContent='말을 마치면 마이크를 다시 눌러 주세요.'; setStep('stt');
      } catch { showError('마이크 권한이 필요합니다.','브라우저 주소창의 마이크 권한을 허용해 주세요.'); cleanAudio(); }
    }

    function stopRecording() {
      recording=false; voiceZone.classList.remove('listening'); cleanAudio();
      if(socket?.readyState===WebSocket.OPEN) socket.send(JSON.stringify({type:'stop'}));
      statusText.textContent='음성을 분석하고 있습니다'; hint.textContent='잠시만 기다려 주세요.'; micButton.disabled=true; setStep('stt');
    }

    micButton.addEventListener('click',()=>recording?stopRecording():startRecording());
    window.addEventListener('beforeunload',()=>{cleanAudio();socket?.close();if(objectUrl)URL.revokeObjectURL(objectUrl);});
  </script>
</body>
</html>
